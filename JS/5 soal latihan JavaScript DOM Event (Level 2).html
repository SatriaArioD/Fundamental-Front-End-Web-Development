<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ondblclick</title>
</head>
<body>
    <p id="doubleclick">Klik dua kali untuk ubah teks</p>
    <script>
        let p = document.getElementById("doubleclick");
        p.ondblclick = function() {
            p.innerText = "Teks sudah berubah!";
        }

    </script>
</body>
</html>
