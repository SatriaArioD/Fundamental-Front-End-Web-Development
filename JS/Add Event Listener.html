<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event Listener</title>
</head>
<body>
<button id="btn">Klik Aku</button>
<script>
    let tombol = document.getElementById("btn");
    tombol.addEventListener("click" , function() {
    alert("Bakekok Papah") 
});  
</script>
    
</body>
</html>
